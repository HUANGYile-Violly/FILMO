<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Movie Mood - FILMO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Ubuntu+Sans:wght@300;400;800&family=Montserrat:wght@300;400;600&family=Mogra&family=Leckerli+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<header>
  <h1 id="siteTitle">Movie Mood</h1>
  <p class="tagline">Collecting movie feelings, one moment at a time.</p>
  
  <div class="trending-section">
    <div class="slider-viewport">
      <div class="slider-track" id="sliderTrack"></div>
    </div>
    <div class="slider-dots" id="sliderDots"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="explore">Explore</button>
    <button class="tab" data-tab="add">Add One / Yours</button>
  </div>
</header>

<main>
  <section id="explore" class="tab-content active">
    <div class="card-grid" id="cardGrid">
      <p id="loadingText" style="text-align:center; padding:50px; color:#999;">Loading memories...</p>
    </div>
  </section>

  <section id="add" class="tab-content">
    <div class="add-layout">
      <form class="movie-form" id="movieForm">
        <h2 class="collect-title">Collect ur Filmo</h2>
        <input id="userName" placeholder="who are you? (nickname)" />
        <input id="filmName" placeholder="a movie you're thinking of..." />
        <input id="watchCount" type="number" placeholder="how many times?" />
        <select id="emoji"></select>
        <textarea id="favoriteLine" placeholder="a line that stayed with you..."></textarea>
        <select id="lineFont">
          <option value="leckerli">Leckerli One</option>
          <option value="pacifico">Pacifico</option>
          <option value="ubuntu">Ubuntu Sans</option>
          <option value="montserrat">Montserrat</option>
        </select>
        <input id="ost" placeholder="a song from the film..." />
        <input id="thoughts" placeholder="your thoughts about this film..." />
        <button type="button" id="addCard">add to explore</button>
      </form>

      <div class="preview-wrapper">
        <h2 class="collect-title">Live Preview</h2>
        <div class="film-card preview" id="previewCard">
          <div class="card-header-info">
             <span id="pUser">stranger</span> <span class="sep">/</span> <span id="pDate"></span>
          </div>
          <h3 class="film-title" id="pFilm">Film Name</h3>
          <div class="meta">
            <span id="pCount">count: 0</span>
            <span id="pEmoji" class="mood-emoji"></span>
          </div>
          <p class="line leckerli" id="pLine">a line that stayed with you...</p>
          <ul class="details">
            <li id="pOst"><strong>Favorite OST:</strong> -</li>
            <li id="pThoughts"><strong>Thoughts:</strong> -</li>
          </ul>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
